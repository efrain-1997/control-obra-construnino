<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Obra · CONSTRUNIÑO S.A.S.</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --blue: #1414c9;
    --blue-deep: #0a0a5e;
    --blue-pale: #e7e7fb;
    --plaster: #f3efe6;
    --concrete: #ada497;
    --charcoal: #262319;
    --ink: #3a352a;
    --amber: #b9791f;
    --green: #2f6b45;
    --line: #d9d2c2;
    --type-a: #e3c894;
    --type-a-ink: #6b4f14;
    --type-b: #a9cbe8;
    --type-b-ink: #1c4a70;
    --type-c: #eebfc5;
    --type-c-ink: #7a2432;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--plaster);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 34px 34px;
    background-position: -1px -1px;
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }
  ::selection{background:var(--blue-pale);}

  .wrap{max-width:1180px;margin:0 auto;padding:28px 24px 80px;}

  /* ---------- HEADER ---------- */
  header.brand{
    display:flex;align-items:center;gap:18px;
    padding:18px 22px;background:#fff;border:1px solid var(--line);
    border-radius:4px;margin-bottom:26px;position:relative;overflow:hidden;
  }
  header.brand::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--blue);}
  .mark svg{display:block;}
  .brand-text{display:flex;flex-direction:column;gap:2px;}
  .brand-text .name{font-family:'Source Serif 4', serif;font-weight:700;font-size:26px;color:var(--charcoal);}
  .brand-text .tag{font-size:13px;color:var(--concrete);font-weight:500;}
  .brand-right{margin-left:auto;text-align:right;font-size:13px;color:var(--concrete);line-height:1.5;}
  .brand-right b{color:var(--blue-deep);font-family:'Source Serif 4',serif;font-size:20px;display:block;}

  /* ---------- BUTTONS / INPUTS ---------- */
  button{
    font-family:'Inter',sans-serif;cursor:pointer;border-radius:3px;
    border:1px solid var(--blue);background:var(--blue);color:#fff;
    padding:10px 18px;font-size:14px;font-weight:600;
    transition:transform .08s ease, background .15s ease;
  }
  button:hover{background:var(--blue-deep);}
  button:active{transform:scale(.98);}
  button.ghost{background:transparent;color:var(--blue-deep);border:1px solid var(--blue);}
  button.ghost:hover{background:var(--blue-pale);}
  button.subtle{background:transparent;border:1px solid var(--line);color:var(--concrete);font-weight:500;}
  button.subtle:hover{border-color:var(--concrete);color:var(--charcoal);background:transparent;}
  button:disabled{opacity:.4;cursor:not-allowed;}

  input[type=number], input[type=text]{
    font-family:'Inter',sans-serif;border:1px solid var(--line);background:#fff;
    padding:9px 11px;border-radius:3px;font-size:14px;color:var(--charcoal);width:100%;
  }
  input:focus{outline:2px solid var(--blue-pale);outline-offset:1px;border-color:var(--blue);}
  input[type=checkbox]{width:auto;accent-color:var(--blue);}
  label{font-size:13px;font-weight:600;color:var(--ink);display:block;margin-bottom:6px;}
  .check-label{display:flex;align-items:center;gap:9px;font-weight:500;font-size:14px;color:var(--ink);cursor:pointer;margin-top:16px;}
  .wiz-grid{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:18px;}
  .wiz-grid > div{flex:1;min-width:170px;}

  /* ---------- SETUP WIZARD ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:34px;}
  .step-eyebrow{font-size:13px;color:var(--blue);font-weight:600;margin-bottom:6px;}
  h1.step-title{font-family:'Source Serif 4',serif;font-weight:600;font-size:24px;margin:0 0 8px;color:var(--charcoal);}
  p.step-sub{color:var(--concrete);font-size:14px;margin:0 0 26px;max-width:560px;line-height:1.55;}

  .floor-row{display:flex;align-items:center;gap:18px;padding:16px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .floor-row:last-of-type{border-bottom:none;}
  .floor-row .flabel{font-family:'Source Serif 4',serif;font-weight:600;font-size:16px;width:100px;color:var(--charcoal);flex:0 0 auto;}
  .floor-row .hint{color:var(--concrete);font-size:12.5px;}
  .type-field{display:flex;align-items:center;gap:8px;}
  .type-field .type-dot{width:11px;height:11px;border-radius:2px;flex:0 0 auto;}
  .type-field input{width:70px;}
  .type-field span.tf-label{font-size:12.5px;color:var(--concrete);font-weight:600;}

  .wizard-actions{display:flex;justify-content:space-between;margin-top:28px;gap:10px;}

  /* ---------- DASHBOARD ---------- */
  .dash{display:grid;grid-template-columns:260px 1fr;gap:22px;align-items:start;}
  @media(max-width:820px){.dash{grid-template-columns:1fr;}}

  .summary-bar{display:flex;gap:18px;margin-bottom:22px;flex-wrap:wrap;}
  .stat{background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 20px;flex:1;min-width:130px;}
  .stat .num{font-family:'Source Serif 4',serif;font-size:26px;font-weight:700;color:var(--blue-deep);}
  .stat .lbl{font-size:12.5px;color:var(--concrete);font-weight:500;margin-top:2px;}

  .floors-nav{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px;position:sticky;top:20px;}
  .floors-nav .nav-title{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--concrete);font-weight:600;padding:8px 10px 4px;}
  .floor-btn{width:100%;text-align:left;display:flex;align-items:center;gap:10px;background:transparent;border:none;color:var(--ink);padding:11px 10px;border-radius:3px;font-weight:500;font-size:14.5px;margin-bottom:2px;}
  .floor-btn:hover{background:var(--plaster);}
  .floor-btn.active{background:var(--blue-pale);color:var(--blue-deep);font-weight:700;}
  .floor-btn .fnum{font-family:'Source Serif 4',serif;font-weight:700;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--blue);color:#fff;font-size:13px;flex:0 0 auto;}
  .floor-btn.active .fnum{background:var(--blue-deep);}
  .floor-btn .fmeta{flex:1;display:flex;flex-direction:column;line-height:1.3;}
  .floor-btn .fmeta small{color:var(--concrete);font-weight:500;font-size:11.5px;}
  .floor-btn.active .fmeta small{color:var(--blue-deep);opacity:.7;}
  .floor-btn .fpct{font-size:12.5px;font-weight:700;color:var(--concrete);}
  .nav-add{margin-top:6px;padding:10px;border-top:1px solid var(--line);}
  .nav-add button{width:100%;padding:8px;font-size:13px;}

  .floor-header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .floor-header h2{font-family:'Source Serif 4',serif;font-size:21px;margin:0;color:var(--charcoal);}

  .notes-card{background:#fff;border:1px solid var(--line);border-radius:4px;margin-top:20px;}
  .notes-head{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);}
  .notes-head .nc-title{font-family:'Source Serif 4',serif;font-weight:600;font-size:15px;color:var(--charcoal);flex:1;}
  .notes-head .nc-count{font-size:11.5px;font-weight:700;color:var(--amber);background:#fbeed9;border-radius:10px;padding:2px 9px;}
  .notes-add{display:flex;gap:8px;padding:14px 18px;border-bottom:1px solid var(--line);}
  .notes-add input{flex:1;}
  .notes-list{max-height:280px;overflow-y:auto;}
  .note-item{padding:12px 18px;border-bottom:1px solid var(--line);}
  .note-item:last-child{border-bottom:none;}
  .note-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .note-date{font-size:11px;color:var(--concrete);font-weight:600;text-transform:uppercase;letter-spacing:.03em;}
  .note-del{background:transparent;border:none;color:var(--concrete);padding:0 4px;font-size:15px;line-height:1;}
  .note-del:hover{color:#b23b3b;background:transparent;}
  .note-text{font-size:13.5px;color:var(--ink);line-height:1.5;white-space:pre-wrap;}
  .notes-empty{padding:18px;text-align:center;color:var(--concrete);font-size:13px;}

  .apts-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:12px;}
  .apt-card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px 14px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;}
  .apt-card:hover{border-color:var(--blue);}
  .apt-card .apt-top{display:flex;align-items:center;justify-content:space-between;}
  .apt-card .apt-num{font-family:'Source Serif 4',serif;font-weight:700;font-size:17px;color:var(--charcoal);}
  .apt-card .apt-pct{font-size:13px;font-weight:700;}
  .type-badge{display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border-radius:3px;padding:2px 7px;letter-spacing:.02em;}
  .type-badge.type-A{background:var(--type-a);color:var(--type-a-ink);}
  .type-badge.type-B{background:var(--type-b);color:var(--type-b-ink);}
  .type-badge.type-C{background:var(--type-c);color:var(--type-c-ink);}
  .apt-card .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;}
  .apt-card .bar > div{height:100%;border-radius:3px;}
  .apt-card .apt-status{font-size:11.5px;font-weight:600;}

  .pct-none{color:var(--concrete);} .pct-progress{color:var(--amber);} .pct-done{color:var(--green);}
  .bar-none > div{background:var(--concrete);} .bar-progress > div{background:var(--amber);} .bar-done > div{background:var(--green);}

  /* ---------- OVERLAYS / MODALS ---------- */
  .overlay{position:fixed;inset:0;background:rgba(20,20,30,.42);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .panel{background:#fff;border-radius:5px;max-width:480px;width:100%;max-height:88vh;overflow-y:auto;border-top:5px solid var(--blue);}
  .panel-head{padding:22px 24px 14px;border-bottom:1px solid var(--line);}
  .panel-head .ph-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .panel-head h3{font-family:'Source Serif 4',serif;font-size:20px;margin:0;color:var(--charcoal);}
  .panel-head .close-x{background:transparent;border:none;color:var(--concrete);font-size:20px;padding:2px 6px;line-height:1;}
  .panel-head .close-x:hover{color:var(--charcoal);background:transparent;}
  .panel-pct-row{display:flex;align-items:center;gap:12px;margin-top:12px;}
  .panel-pct-row .bar{flex:1;height:9px;border-radius:5px;background:var(--line);overflow:hidden;}
  .panel-pct-row .bar>div{height:100%;border-radius:5px;}
  .panel-pct-row .pctnum{font-family:'Source Serif 4',serif;font-weight:700;font-size:17px;min-width:44px;text-align:right;}

  .stage-acc{border-bottom:1px solid var(--line);}
  .stage-acc:last-child{border-bottom:none;}
  .stage-acc-head{display:flex;align-items:center;gap:10px;padding:14px 24px;cursor:pointer;}
  .stage-acc-head .san{font-family:'Source Serif 4',serif;font-weight:600;font-size:15px;color:var(--charcoal);flex:1;}
  .stage-acc-head .sfrac{font-size:12px;color:var(--concrete);font-weight:600;}
  .stage-acc-head .scaret{color:var(--concrete);font-size:12px;transition:transform .15s ease;}
  .stage-acc.open .scaret{transform:rotate(90deg);}
  .stage-acc-head .sbar{width:56px;height:5px;border-radius:3px;background:var(--line);overflow:hidden;}
  .stage-acc-head .sbar>div{height:100%;}
  .stage-acc-body{max-height:0;overflow:hidden;}
  .stage-acc.open .stage-acc-body{max-height:900px;}
  .room-row{display:flex;align-items:center;gap:12px;padding:9px 24px 9px 46px;}
  .room-check{width:20px;height:20px;border-radius:4px;border:2px solid var(--concrete);flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#fff;}
  .room-check.checked{background:var(--green);border-color:var(--green);}
  .room-check.checked::after{content:"✓";color:#fff;font-size:12px;font-weight:700;}
  .room-name{flex:1;font-size:13.5px;color:var(--ink);}
  .room-row.checked .room-name{color:var(--concrete);text-decoration:line-through;text-decoration-color:var(--line);}

  .panel-foot{padding:16px 24px 22px;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);}

  .type-modal .panel{max-width:340px;text-align:center;padding-bottom:6px;}
  .type-choice-row{display:flex;flex-direction:column;gap:10px;padding:22px 24px;}
  .type-choice{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:4px;background:#fff;text-align:left;}
  .type-choice:hover{border-color:var(--blue);}
  .type-choice .tc-dot{width:14px;height:14px;border-radius:3px;flex:0 0 auto;}
  .type-choice .tc-name{font-weight:700;color:var(--charcoal);}
  .type-choice .tc-rooms{font-size:11.5px;color:var(--concrete);display:block;font-weight:500;}

  .plan-section{padding:18px 24px 4px;border-bottom:1px solid var(--line);}
  .plan-section .ps-title{font-family:'Source Serif 4',serif;font-weight:600;font-size:14.5px;color:var(--charcoal);margin-bottom:2px;}
  .plan-section .ps-sub{font-size:12px;color:var(--concrete);margin-bottom:10px;}
  .stage-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
  .stage-chip{padding:6px 11px;font-size:12px;font-weight:600;border-radius:14px;border:1px solid var(--line);background:#fff;color:var(--ink);}
  .stage-chip:hover{border-color:var(--blue);background:#fff;}
  .stage-chip.active{background:var(--blue);border-color:var(--blue);color:#fff;}
  .plan-wrap{position:relative;width:100%;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-bottom:14px;background:#fafaf7;}
  .plan-wrap img{display:block;width:100%;height:auto;}
  .hotspot{position:absolute;border:1.5px solid rgba(20,20,201,.35);border-radius:3px;cursor:pointer;transition:background .12s ease;}
  .hotspot:hover{border-color:var(--blue);background:rgba(20,20,201,.10);}
  .hotspot.done{background:rgba(47,107,69,.32);border-color:var(--green);}
  .hotspot-legend{display:flex;gap:14px;font-size:11.5px;color:var(--concrete);margin-bottom:16px;flex-wrap:wrap;}
  .hotspot-legend span{display:inline-flex;align-items:center;gap:5px;}
  .hotspot-legend i{width:11px;height:11px;border-radius:2px;display:inline-block;border:1.5px solid rgba(20,20,201,.35);}
  .hotspot-legend i.leg-done{background:rgba(47,107,69,.32);border-color:var(--green);}

  .empty-state{text-align:center;padding:60px 20px;color:var(--concrete);}
  .empty-state .es-mark{font-size:40px;margin-bottom:10px;}
  footer.foot{text-align:center;color:var(--concrete);font-size:12px;margin-top:44px;}
</style>
</head>

// hacia la esquina, subiendo al ala de arriba, entrando de vuelta al núcleo,
// cruzando al ala derecha y repitiendo el mismo recorrido).
const STANDARD_FLOOR_ORDER = ['C','A','B','B','A','C','C','A','B','C','A','B'];

function typeSequenceForCounts(counts){
  const a = counts.a||0, b = counts.b||0, c = counts.c||0;
  if (a===4 && b===4 && c===4) return STANDARD_FLOOR_ORDER.slice();
  const seq = [];
  for (let i=0;i<a;i++) seq.push('A');
  for (let i=0;i<b;i++) seq.push('B');
  for (let i=0;i<c;i++) seq.push('C');
  return seq;
}

  activeFloor: null,
  openApt: null,
  openStage: null,
  addAptFloor: null,
  planStage: 'maxi'
};

function computeFloorLabels(count, firstLabel){
  const labels = [];
  const trimmed = (firstLabel || '').trim();
  const asInt = parseInt(trimmed, 10);
  const isNumeric = trimmed !== '' && String(asInt) === trimmed;
  for (let i=0;i<count;i++){
    if (i === 0){
      labels.push(trimmed === '' ? '1' : trimmed);
    } else if (isNumeric){
      labels.push(String(asInt + i));
    } else {
      labels.push(String(i));
    }
  }
  return labels;
}

function buildFloorsFromWizard(){
  const w = state.wizard;
  const labels = computeFloorLabels(w.floorCount, w.firstFloorLabel);
  return labels.map((lbl,i)=>{
    const counts = w.sameQty ? w.typeCounts : (w.perFloorTypeCounts[i] || {a:0,b:0,c:0});
    const typeSeq = typeSequenceForCounts(counts);
    const apartments = typeSeq.map((t,idx)=> makeApt(t, (i+1)*100 + idx + 1));
    return { id: uid('floor'), number: i+1, label: lbl, apartments, notes: [] };
  });
}

const app = document.getElementById('app');

function monogramSVG(){
  return `<svg width="58" height="58" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
    <text x="8" y="90" font-family="Source Serif 4, Georgia, serif" font-weight="700" font-size="96" fill="#1414c9">C</text>
    <text x="42" y="90" font-family="Source Serif 4, Georgia, serif" font-weight="700" font-size="96" fill="#1414c9">N</text>
  </svg>`;
}

async function load(){
  try{
    const res = await window.storage.get(STORE_KEY, false);
    state.data = res && res.value ? JSON.parse(res.value) : null;
  }catch(e){ state.data = null; }
  if (state.data && state.data.floors && state.data.floors.length){
    state.view = 'dashboard';
    state.activeFloor = state.data.floors[0].id;
  } else {
    state.view = 'setup';
  }
  render();
}
async function persist(){
  try{ await window.storage.set(STORE_KEY, JSON.stringify(state.data), false); }
  catch(e){ console.error('No se pudo guardar', e); }
}
function uid(p){ return p + '_' + Math.random().toString(36).slice(2,9); }
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayLabel(){
  return new Date().toLocaleDateString('es-CO', {day:'2-digit', month:'short', year:'numeric'});
}

function makeApt(type, num){
  const rooms = {};
  ROOM_TEMPLATES[type].forEach(r=>{ rooms[r] = {maxi:false,estuco:false,p1:false,p2:false,acab:false}; });
  return { id: uid('apt'), num, type, rooms };
}

function pctOf(apt){
  const roomNames = Object.keys(apt.rooms);
  const total = roomNames.length * STAGES.length;
  if (!total) return 0;
  let checked = 0;
  roomNames.forEach(r=> STAGES.forEach(s=>{ if (apt.rooms[r][s.key]) checked++; }));
  return Math.round((checked/total)*100);
}
function stageInfo(apt, stageKey){
  const roomNames = Object.keys(apt.rooms);
  const done = roomNames.filter(r=>apt.rooms[r][stageKey]).length;
  return { done, total: roomNames.length, pct: roomNames.length ? Math.round(done/roomNames.length*100) : 0 };
}
function floorPct(floor){
  if (!floor.apartments.length) return 0;
  return Math.round(floor.apartments.reduce((a,ap)=>a+pctOf(ap),0)/floor.apartments.length);
}
function statusClass(pct){ if(pct===0) return 'none'; if(pct===100) return 'done'; return 'progress'; }
function statusLabel(pct){ if(pct===0) return 'Sin iniciar'; if(pct===100) return 'Terminado'; return 'En proceso'; }
function barColor(pct){ if(pct===0) return 'var(--concrete)'; if(pct===100) return 'var(--green)'; return 'var(--amber)'; }

function header(){
  const totalApts = state.data ? state.data.floors.reduce((a,f)=>a+f.apartments.length,0) : 0;
  const avg = (state.data && totalApts) ? Math.round(
    state.data.floors.reduce((a,f)=>a+f.apartments.reduce((b,ap)=>b+pctOf(ap),0),0) / totalApts
  ) : 0;
  const pname = state.data && state.data.projectName;
  return `
  <header class="brand">
    <div class="mark">${monogramSVG()}</div>
    <div class="brand-text">
      <div class="name">CONSTRUNIÑO S.A.S.</div>
      <div class="tag">${pname ? pname + ' · ' : ''}Control de obra · Acabados por ambiente</div>
    </div>
    ${state.view==='dashboard' ? `<div class="brand-right"><b>${avg}%</b>avance general</div>` : ''}
  </header>`;
}

function render(){
  let body = '';
  if (state.view === 'setup') body = renderSetup();
  else if (state.view === 'dashboard') body = renderDashboard();
  app.innerHTML = header() + body + `<footer class="foot">CONSTRUNIÑO S.A.S. — seguimiento interno de acabados</footer>`;
  attachHandlers();
}

/* ---------------- SETUP ---------------- */
function renderSetup(){
  const w = state.wizard;
  if (w.step === 1) return renderStep1();
  if (w.step === 2) return renderStep2();
  if (w.step === 3) return renderStep3();
  return renderStep4();
}

function renderStep1(){
  const w = state.wizard;
  return `

    <div class="step-eyebrow">Paso 1 de 4</div>

      <div>
        <label for="floorCountInput">Número de pisos</label>

      </div>

}

    ${w.sameQty ? `
      <label for="totalPerFloorInput">Apartamentos por piso</label>
      <input id="totalPerFloorInput" type="number" min="0" max="60" style="max-width:160px;" value="${w.totalPerFloor===null?'':w.totalPerFloor}" placeholder="Ej: 4">
    ` : `<div>${perFloorRows}</div>`}

      <input type="checkbox" id="sameQtyCheckbox" ${w.sameQty?'checked':''}>

    </label>
    <div class="wizard-actions">
      <button class="subtle" id="wizBack1">Atrás</button>
      <button id="wizNext2">Siguiente</button>
    </div>
  </div>`;
}

function renderStep3(){
  const w = state.wizard;
  const labels = computeFloorLabels(w.floorCount, w.firstFloorLabel);
  let content;
  if (w.sameQty){
    const c = w.typeCounts;
    content = `
      <div class="floor-row" style="border-bottom:none;">
        <div class="type-field"><span class="type-dot" style="background:var(--type-a)"></span><span class="tf-label">A</span>
          <input type="number" min="0" max="30" value="${c.a===null?'':c.a}" data-type="a" class="type-total-input" placeholder="0"></div>
        <div class="type-field"><span class="type-dot" style="background:var(--type-b)"></span><span class="tf-label">B</span>
          <input type="number" min="0" max="30" value="${c.b===null?'':c.b}" data-type="b" class="type-total-input" placeholder="0"></div>
        <div class="type-field"><span class="type-dot" style="background:var(--type-c)"></span><span class="tf-label">C</span>
          <input type="number" min="0" max="30" value="${c.c===null?'':c.c}" data-type="c" class="type-total-input" placeholder="0"></div>
      </div>
      <p class="step-sub" style="margin-top:12px;">Esta distribución se aplicará a los ${w.floorCount} pisos.</p>`;
  } else {
    content = `<div>${labels.map((lbl,i)=>{
      const c = w.perFloorTypeCounts[i] || {a:null,b:null,c:null};
      return `
      <div class="floor-row">
        <div class="flabel">Piso ${lbl}</div>
        <div class="type-field"><span class="type-dot" style="background:var(--type-a)"></span><span class="tf-label">A</span>
          <input type="number" min="0" max="30" value="${c.a===null?'':c.a}" data-floor-idx="${i}" data-type="a" class="pf-type-input" placeholder="0"></div>
        <div class="type-field"><span class="type-dot" style="background:var(--type-b)"></span><span class="tf-label">B</span>
          <input type="number" min="0" max="30" value="${c.b===null?'':c.b}" data-floor-idx="${i}" data-type="b" class="pf-type-input" placeholder="0"></div>
        <div class="type-field"><span class="type-dot" style="background:var(--type-c)"></span><span class="tf-label">C</span>

    }).join('')}</div>`;
  }
  return `
  <div class="card">
    <div class="step-eyebrow">Paso 3 de 4</div>
    <h1 class="step-title">¿Cuántos apartamentos de cada tipo?</h1>
    <p class="step-sub">Tipo A, B o C. Cada tipo trae su propia lista de ambientes (baños, cocina, labores, habitaciones, sala, balcón, etc.) para desglosar cada etapa por ambiente.</p>

    <div class="wizard-actions">

      <button id="wizNext3">Siguiente</button>

  </div>`;
}

function renderStep4(){
  const w = state.wizard;
  const floors = buildFloorsFromWizard();
  const totalApts = floors.reduce((a,f)=>a+f.apartments.length,0);
  const rows = floors.map(f=>{
    const a = f.apartments.filter(x=>x.type==='A').length;
    const b = f.apartments.filter(x=>x.type==='B').length;
    const c = f.apartments.filter(x=>x.type==='C').length;

    <div class="floor-row">
      <div class="flabel">Piso ${f.label}</div>
      <span class="hint">${f.apartments.length} apto${f.apartments.length===1?'':'s'} — A: ${a} · B: ${b} · C: ${c}</span>
    </div>`;

  <div class="card">
    <div class="step-eyebrow">Paso 4 de 4</div>

      <button class="subtle" id="wizBack3">Atrás</button>
      <button id="createObra">Crear obra</button>
    </div>
  </div>`;
}

/* ---------------- DASHBOARD ---------------- */
function renderFloorNotes(floor){
  const notes = floor.notes || [];
  const items = notes.slice().reverse().map(n=>`
    <div class="note-item">
      <div class="note-top">
        <span class="note-date">${n.date}</span>
        <button class="note-del" data-del-note="${n.id}" data-note-floor="${floor.id}" title="Eliminar">×</button>
      </div>
      <div class="note-text">${escapeHtml(n.text)}</div>
    </div>`).join('');
  return `
  <div class="notes-card">
    <div class="notes-head">
      <span class="nc-title">Observaciones del piso — qué falta / por qué no está terminado</span>
      ${notes.length ? `<span class="nc-count">${notes.length}</span>` : ''}
    </div>
    <div class="notes-add">
      <input type="text" id="noteInput" placeholder="Ej: falta material para estuco en apto 205, se retrasó por lluvia..." data-note-floor="${floor.id}">
      <button id="addNoteBtn" data-note-floor="${floor.id}">Agregar</button>
    </div>
    <div class="notes-list">${items || '<div class="notes-empty">Sin observaciones todavía.</div>'}</div>
  </div>`;
}

function renderDashboard(){
  const floors = state.data.floors;
  const totalApts = floors.reduce((a,f)=>a+f.apartments.length,0);
  const doneApts = floors.reduce((a,f)=>a+f.apartments.filter(ap=>pctOf(ap)===100).length,0);
  const inProgress = floors.reduce((a,f)=>a+f.apartments.filter(ap=>{const p=pctOf(ap);return p>0&&p<100;}).length,0);

  const nav = floors.map(f=>{
    const p = floorPct(f);
    const active = f.id === state.activeFloor;
    return `
    <button class="floor-btn ${active?'active':''}" data-floor="${f.id}">
      <span class="fnum">${f.number}</span>
      <span class="fmeta">Piso ${f.label!==undefined?f.label:f.number}<small>${f.apartments.length} apto${f.apartments.length===1?'':'s'}${(f.notes&&f.notes.length)?' · '+f.notes.length+' obs.':''}</small></span>
      <span class="fpct">${p}%</span>
    </button>`;
  }).join('');

  const activeFloorObj = floors.find(f=>f.id===state.activeFloor) || floors[0];

  let grid = '';
  if (!activeFloorObj || !activeFloorObj.apartments.length){
    grid = `<div class="empty-state"><div class="es-mark">◻</div>Este piso aún no tiene apartamentos.<br><button class="ghost" style="margin-top:14px;" data-add-apt="${activeFloorObj?activeFloorObj.id:''}">Agregar apartamento</button></div>`;
  } else {
    grid = `<div class="apts-grid">` + activeFloorObj.apartments.map(ap=>{
      const p = pctOf(ap);
      const st = statusClass(p);
      return `
      <button class="apt-card" data-open-floor="${activeFloorObj.id}" data-open-apt="${ap.id}">
        <div class="apt-top">
          <span class="apt-num">Apto ${ap.num}</span>
          <span class="type-badge type-${ap.type}">${ap.type}</span>
        </div>
        <div class="bar bar-${st}"><div style="width:${p}%;"></div></div>
        <div class="apt-status pct-${st}">${statusLabel(p)} · ${p}%</div>
      </button>`;
    }).join('') + `</div>`;
  }

  return `
  <div class="summary-bar">
    <div class="stat"><div class="num">${totalApts}</div><div class="lbl">Apartamentos totales</div></div>
    <div class="stat"><div class="num">${doneApts}</div><div class="lbl">Terminados</div></div>
    <div class="stat"><div class="num">${inProgress}</div><div class="lbl">En proceso</div></div>
    <div class="stat"><div class="num">${floors.length}</div><div class="lbl">Pisos</div></div>
  </div>
  <div class="dash">
    <nav class="floors-nav">
      <div class="nav-title">Pisos</div>
      ${nav}
      <div class="nav-add"><button class="ghost" id="addFloorBtn">+ Agregar piso</button></div>
    </nav>
    <div>
      <div class="floor-header">
        <h2>Piso ${activeFloorObj ? (activeFloorObj.label!==undefined?activeFloorObj.label:activeFloorObj.number) : ''}</h2>
        <button class="subtle" data-add-apt="${activeFloorObj?activeFloorObj.id:''}">+ Apartamento</button>
      </div>
      ${grid}
      ${activeFloorObj ? renderFloorNotes(activeFloorObj) : ''}
    </div>
  </div>
  ${state.openApt ? renderPanel() : ''}
  ${state.addAptFloor ? renderTypeModal() : ''}
  `;
}

function renderTypeModal(){
  return `
  <div class="overlay type-modal" id="typeOverlay">
    <div class="panel">
      <div class="panel-head"><div class="ph-top"><h3>¿Qué tipo de apartamento?</h3><button class="close-x" id="closeTypeModal">×</button></div></div>
      <div class="type-choice-row">
        ${['A','B','C'].map(t=>`
        <button class="type-choice" data-pick-type="${t}">
          <span class="tc-dot" style="background:var(--type-${t.toLowerCase()})"></span>
          <span>
            <span class="tc-name">${TYPE_NAMES[t]}</span>
            <span class="tc-rooms">${ROOM_TEMPLATES[t].join(' · ')}</span>
          </span>
        </button>`).join('')}
      </div>
    </div>
  </div>`;
}

function renderPanel(){
  const floor = state.data.floors.find(f=>f.id===state.openApt.floorId);
  if (!floor) return '';
  const apt = floor.apartments.find(a=>a.id===state.openApt.aptId);
  if (!apt) return '';
  const p = pctOf(apt);
  const st = statusClass(p);
  const roomNames = Object.keys(apt.rooms);

  const sections = STAGES.map(s=>{
    const info = stageInfo(apt, s.key);
    const open = state.openStage === s.key;
    const rooms = roomNames.map(r=>{
      const checked = !!apt.rooms[r][s.key];
      return `
      <div class="room-row ${checked?'checked':''}" data-toggle-room="${r}" data-toggle-stage="${s.key}">
        <div class="room-check ${checked?'checked':''}"></div>
        <div class="room-name">${r}</div>
      </div>`;
    }).join('');
    return `
    <div class="stage-acc ${open?'open':''}">
      <div class="stage-acc-head" data-stage-toggle="${s.key}">
        <span class="scaret">▶</span>
        <span class="san">${s.name}</span>
        <span class="sbar"><div style="width:${info.pct}%;background:${barColor(info.pct)};"></div></span>
        <span class="sfrac">${info.done}/${info.total}</span>
      </div>
      <div class="stage-acc-body">${rooms}</div>
    </div>`;
  }).join('');

  const hotspots = HOTSPOTS[apt.type] || {};
  const activeStage = state.planStage;
  const hotspotDivs = Object.keys(hotspots).map(room=>{
    const box = hotspots[room];
    const done = !!(apt.rooms[room] && apt.rooms[room][activeStage]);
    return `<div class="hotspot ${done?'done':''}" title="${room}"
      style="left:${box.left}%;top:${box.top}%;width:${box.w}%;height:${box.h}%;"
      data-plan-room="${room}"></div>`;
  }).join('');

  const planSection = `
  <div class="plan-section">
    <div class="ps-title">Plano de la tipología ${apt.type}</div>
    <div class="ps-sub">Elige la etapa y toca el ambiente en el plano para marcarlo como completado.</div>
    <div class="stage-chips">
      ${STAGES.map(s=>`<button class="stage-chip ${s.key===activeStage?'active':''}" data-plan-stage="${s.key}">${s.name}</button>`).join('')}
    </div>
    <div class="plan-wrap">
      <img src="${ROOM_PLANS[apt.type]}" alt="Plano tipología ${apt.type}">
      ${hotspotDivs}
    </div>
    <div class="hotspot-legend">
      <span><i></i> Pendiente</span>
      <span><i class="leg-done"></i> Completado (${STAGES.find(s=>s.key===activeStage).name})</span>
    </div>
  </div>`;

  return `
  <div class="overlay" id="overlay">
    <div class="panel">
      <div class="panel-head">
        <div class="ph-top">
          <h3>Piso ${floor.label!==undefined?floor.label:floor.number} · Apto ${apt.num} <span class="type-badge type-${apt.type}">${apt.type}</span></h3>
          <button class="close-x" id="closePanel">×</button>
        </div>
        <div class="panel-pct-row">
          <div class="bar"><div style="width:${p}%;background:${barColor(p)};"></div></div>
          <div class="pctnum pct-${st}">${p}%</div>
        </div>
      </div>
      ${planSection}
      <div>${sections}</div>
      <div class="panel-foot">
        <button class="subtle" id="deleteApt">Eliminar apartamento</button>
        <button id="doneBtn">Listo</button>
      </div>
    </div>
  </div>`;
}

/* ---------------- HANDLERS ---------------- */
function attachHandlers(){
  // Paso 1
  const wizNext1 = document.getElementById('wizNext1');
  if (wizNext1) wizNext1.onclick = () => {
    const v = parseInt(document.getElementById('floorCountInput').value, 10);
    if (!v || v < 1) return;
    const label = document.getElementById('firstFloorLabelInput').value.trim();
    const pname = document.getElementById('projectNameInput').value.trim();
    state.wizard.floorCount = v;
    state.wizard.firstFloorLabel = label || '1';
    state.wizard.projectName = pname;
    if (state.wizard.perFloorTotals.length !== v) state.wizard.perFloorTotals = Array(v).fill(null);
    if (state.wizard.perFloorTypeCounts.length !== v) state.wizard.perFloorTypeCounts = Array.from({length:v}).map(()=>({a:null,b:null,c:null}));
    state.wizard.step = 2;
    render();
  };

  // Paso 2
  const wizBack1 = document.getElementById('wizBack1');
  if (wizBack1) wizBack1.onclick = () => { state.wizard.step = 1; render(); };
  const totalPerFloorInput = document.getElementById('totalPerFloorInput');
  if (totalPerFloorInput) totalPerFloorInput.oninput = (e)=>{
    state.wizard.totalPerFloor = e.target.value === '' ? null : parseInt(e.target.value,10);
  };
  document.querySelectorAll('.pf-total-input').forEach(inp=>{
    inp.oninput = (e)=>{
      const idx = parseInt(e.target.dataset.pfTotalIdx,10);
      state.wizard.perFloorTotals[idx] = e.target.value === '' ? null : parseInt(e.target.value,10);
    };
  });
  const sameQtyCheckbox = document.getElementById('sameQtyCheckbox');
  if (sameQtyCheckbox) sameQtyCheckbox.onchange = (e)=>{
    state.wizard.sameQty = e.target.checked;
    render();
  };
  const wizNext2 = document.getElementById('wizNext2');
  if (wizNext2) wizNext2.onclick = () => { state.wizard.step = 3; render(); };

  // Paso 3
  const wizBack2 = document.getElementById('wizBack2');
  if (wizBack2) wizBack2.onclick = () => { state.wizard.step = 2; render(); };
  document.querySelectorAll('.type-total-input').forEach(inp=>{
    inp.oninput = (e)=>{
      state.wizard.typeCounts[e.target.dataset.type] = e.target.value === '' ? null : parseInt(e.target.value,10);
    };
  });
  document.querySelectorAll('.pf-type-input').forEach(inp=>{
    inp.oninput = (e)=>{
      const idx = parseInt(e.target.dataset.floorIdx,10);
      const type = e.target.dataset.type;
      if (!state.wizard.perFloorTypeCounts[idx]) state.wizard.perFloorTypeCounts[idx] = {a:null,b:null,c:null};
      state.wizard.perFloorTypeCounts[idx][type] = e.target.value === '' ? null : parseInt(e.target.value,10);
    };
  });
  const wizNext3 = document.getElementById('wizNext3');
  if (wizNext3) wizNext3.onclick = () => { state.wizard.step = 4; render(); };

  // Paso 4
  const wizBack3 = document.getElementById('wizBack3');
  if (wizBack3) wizBack3.onclick = () => { state.wizard.step = 3; render(); };
  const createObra = document.getElementById('createObra');
  if (createObra) createObra.onclick = async () => {
    const floors = buildFloorsFromWizard();
    state.data = { projectName: state.wizard.projectName, floors };
    state.activeFloor = floors[0] ? floors[0].id : null;
    state.view = 'dashboard';
    state.wizard = { step:1, floorCount:null, firstFloorLabel:'1', projectName:'', sameQty:true, totalPerFloor:null, perFloorTotals:[], typeCounts:{a:null,b:null,c:null}, perFloorTypeCounts:[] };
    await persist();
    render();
  };

  const addNoteBtn = document.getElementById('addNoteBtn');
  if (addNoteBtn) addNoteBtn.onclick = async ()=>{
    const input = document.getElementById('noteInput');
    const text = input.value.trim();
    if (!text) return;
    const floor = state.data.floors.find(f=>f.id===addNoteBtn.dataset.noteFloor);
    if (!floor) return;
    if (!floor.notes) floor.notes = [];
    floor.notes.push({ id: uid('note'), text, date: todayLabel() });
    await persist();
    render();
  };
  const noteInput = document.getElementById('noteInput');
  if (noteInput) noteInput.onkeydown = (e)=>{
    if (e.key === 'Enter') { e.preventDefault(); document.getElementById('addNoteBtn').click(); }
  };
  document.querySelectorAll('[data-del-note]').forEach(btn=>{
    btn.onclick = async ()=>{
      const floor = state.data.floors.find(f=>f.id===btn.dataset.noteFloor);
      if (!floor) return;
      floor.notes = (floor.notes||[]).filter(n=>n.id!==btn.dataset.delNote);
      await persist();
      render();
    };
  });

  document.querySelectorAll('[data-floor]').forEach(btn=>{
    btn.onclick = ()=>{ state.activeFloor = btn.dataset.floor; render(); };
  });

  const addFloorBtn = document.getElementById('addFloorBtn');
  if (addFloorBtn) addFloorBtn.onclick = async ()=>{
    const nextNum = state.data.floors.length ? Math.max(...state.data.floors.map(f=>f.number))+1 : 1;
    const newFloor = { id: uid('floor'), number: nextNum, label: String(nextNum), apartments: [], notes: [] };
    state.data.floors.push(newFloor);
    state.activeFloor = newFloor.id;
    await persist();
    render();
  };

  document.querySelectorAll('[data-add-apt]').forEach(btn=>{
    btn.onclick = ()=>{
      const floorId = btn.dataset.addApt;
      if (!floorId) return;
      state.addAptFloor = floorId;
      render();
    };
  });

  const typeOverlay = document.getElementById('typeOverlay');
  if (typeOverlay) typeOverlay.onclick = (e)=>{ if(e.target.id==='typeOverlay'){ state.addAptFloor=null; render(); } };
  const closeTypeModal = document.getElementById('closeTypeModal');
  if (closeTypeModal) closeTypeModal.onclick = ()=>{ state.addAptFloor=null; render(); };

  document.querySelectorAll('[data-pick-type]').forEach(btn=>{
    btn.onclick = async ()=>{
      const floor = state.data.floors.find(f=>f.id===state.addAptFloor);
      if (!floor) return;
      const nextSeq = floor.apartments.length
        ? Math.max(...floor.apartments.map(a=>a.num)) + 1
        : floor.number*100 + 1;
      floor.apartments.push(makeApt(btn.dataset.pickType, nextSeq));
      state.addAptFloor = null;
      await persist();
      render();
    };
  });

  document.querySelectorAll('[data-open-apt]').forEach(btn=>{
    btn.onclick = ()=>{
      state.openApt = { floorId: btn.dataset.openFloor, aptId: btn.dataset.openApt };
      state.openStage = null;
      render();
    };
  });

  const overlay = document.getElementById('overlay');
  if (overlay) overlay.onclick = (e)=>{ if (e.target.id==='overlay'){ state.openApt=null; render(); } };
  const closePanel = document.getElementById('closePanel');
  if (closePanel) closePanel.onclick = ()=>{ state.openApt=null; render(); };
  const doneBtn = document.getElementById('doneBtn');
  if (doneBtn) doneBtn.onclick = ()=>{ state.openApt=null; render(); };

  document.querySelectorAll('[data-plan-stage]').forEach(el=>{
    el.onclick = ()=>{ state.planStage = el.dataset.planStage; render(); };
  });

  document.querySelectorAll('[data-plan-room]').forEach(el=>{
    el.onclick = async ()=>{
      const floor = state.data.floors.find(f=>f.id===state.openApt.floorId);
      const apt = floor.apartments.find(a=>a.id===state.openApt.aptId);
      const room = el.dataset.planRoom;
      const stage = state.planStage;
      if (!apt.rooms[room]) return;
      apt.rooms[room][stage] = !apt.rooms[room][stage];
      await persist();
      render();
    };
  });

  document.querySelectorAll('[data-stage-toggle]').forEach(el=>{
    el.onclick = ()=>{
      const key = el.dataset.stageToggle;
      state.openStage = state.openStage === key ? null : key;
      render();
    };
  });

  document.querySelectorAll('[data-toggle-room]').forEach(el=>{
    el.onclick = async ()=>{
      const floor = state.data.floors.find(f=>f.id===state.openApt.floorId);
      const apt = floor.apartments.find(a=>a.id===state.openApt.aptId);
      const room = el.dataset.toggleRoom;
      const stage = el.dataset.toggleStage;
      apt.rooms[room][stage] = !apt.rooms[room][stage];
      await persist();
      render();
    };
  });

  const deleteApt = document.getElementById('deleteApt');
  if (deleteApt) deleteApt.onclick = async ()=>{
    const floor = state.data.floors.find(f=>f.id===state.openApt.floorId);
    floor.apartments = floor.apartments.filter(a=>a.id!==state.openApt.aptId);
    state.openApt = null;
    await persist();
    render();
  };
}

load();
</script>
</body>
</html>
